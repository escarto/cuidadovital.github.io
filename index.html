<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hogar Geriátrico Cuidado Vital · Cali</title>
<meta name="description" content="Hogar geriátrico en Cali con atención médica, enfermería, fisioterapia y nutrición. Estadía permanente, temporal, Club Día y Pasa Día.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#010E2E; --navy-2:#0B2347; --navy-line:#1C3A66;
  --blue:#1E9BE6; --blue-ink:#0B6FB0; --grey:#808288;
  --bg:#F2F6FB; --surface:#FFFFFF; --ink:#0A1A3A; --muted:#4A5670; --line:#DCE4EE;
  --tint:#E6F2FC; --on-navy:#FFFFFF; --on-navy-muted:#AFC0D8;
  --font-head:"Quicksand","Nunito","Varela Round",system-ui,sans-serif;
  --font-body:"Montserrat","Helvetica Neue",Arial,system-ui,sans-serif;
  --wrap:1160px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#020F2C; --surface:#0A1D3F; --ink:#EAF1FA; --muted:#A9B8CD; --line:#1C3459;
    --tint:#0F2A52; --blue-ink:#5DB9F2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#020F2C; --surface:#0A1D3F; --ink:#EAF1FA; --muted:#A9B8CD; --line:#1C3459;
  --tint:#0F2A52; --blue-ink:#5DB9F2; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16.5px;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;line-height:1.12;margin:0;letter-spacing:-.01em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{width:min(100% - 40px,var(--wrap));margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;text-decoration:none;font-family:var(--font-head);font-weight:700;font-size:1.02rem;padding:14px 24px;border-radius:999px;transition:background-color .2s,color .2s}
.btn .ico{width:20px;height:20px}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#1688cc}
.btn-ghost{background:transparent;color:var(--on-navy);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--blue);color:#fff}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-line:hover{box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn-sm{padding:9px 16px;font-size:.92rem}
.btn-danger{background:#C2352B;color:#fff}

/* ---------- header ---------- */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:var(--on-navy);border-bottom:1px solid var(--navy-line)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:46px;height:auto}
.brand-name{font-family:var(--font-head);font-weight:700;font-size:1.32rem;line-height:1;letter-spacing:-.01em}
.brand-name b{color:var(--blue);font-weight:700}
.brand-name span{color:#9EA1A7}
.brand-sub{display:block;font-family:var(--font-body);font-size:.66rem;letter-spacing:.32em;color:#9EA1A7;margin-top:5px;font-weight:500}
.nav{display:flex;align-items:center;gap:6px}
.nav a{text-decoration:none;font-weight:500;font-size:.95rem;padding:8px 13px;border-radius:999px;color:var(--on-navy-muted)}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{color:#fff;background:var(--navy-2)}
.nav .btn{margin-left:10px;color:#fff}
.menu-btn{display:none;background:none;border:0;color:#fff;padding:8px;cursor:pointer}
.menu-btn .ico{width:28px;height:28px}
@media (max-width:920px){
  .menu-btn{display:block}
  .nav{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 76px) 0 auto 0;flex-direction:column;align-items:stretch;gap:2px;background:var(--navy);padding:12px 20px 24px;border-bottom:1px solid var(--navy-line);display:none}
  .nav.open{display:flex}
  .nav a{padding:13px 14px;font-size:1.05rem}
  .nav .btn{margin:10px 0 0;justify-content:center}
}

/* ---------- hero ---------- */
.hero{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.hero-arcs{position:absolute;inset:0;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:84px 0 100px}
.hero-kicker{color:var(--blue);font-family:var(--font-head);font-weight:600;font-size:1.08rem;margin-bottom:18px}
.hero h1{font-size:clamp(2.6rem,5.6vw,4.4rem);line-height:1.04;max-width:12ch}
.hero-lead{color:var(--on-navy-muted);font-size:1.15rem;max-width:34ch;margin-top:24px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:44px;color:var(--on-navy-muted);font-size:.93rem}
.hero-meta span{display:inline-flex;align-items:center;gap:8px}
.hero-meta .ico{width:18px;height:18px;color:var(--blue)}
.orbit{position:relative;width:min(100%,520px);aspect-ratio:1;margin-inline:auto}
.orbit-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--blue)}
.orbit-photo{position:absolute;inset:6%;border-radius:50%;overflow:hidden;background:#dfe6ee}
.orbit-photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.03)}
.orbit-track{position:absolute;inset:0;transform:rotate(0deg)}
.orbit-dot{position:absolute;right:-13px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 6px var(--navy)}
.orbit-grey{position:absolute;left:9%;top:9%;width:16px;height:16px;border-radius:50%;background:var(--grey)}
@media (prefers-reduced-motion:no-preference){
  .orbit-track{animation:travel 2.2s cubic-bezier(.2,.7,.2,1) .25s both}
  @keyframes travel{from{transform:rotate(-200deg)}to{transform:rotate(0deg)}}
}
@media (max-width:860px){
  .hero-in{grid-template-columns:1fr;padding:48px 0 72px;gap:44px}
  .orbit{width:min(86%,400px);order:-1}
}

/* ---------- sections ---------- */
.sec{padding:104px 0}
.sec-head{max-width:640px;margin-bottom:48px}
.kicker{color:var(--blue-ink);font-family:var(--font-head);font-weight:700;font-size:1.02rem;margin-bottom:12px}
.sec h2{font-size:clamp(2rem,4vw,3rem)}
.sec-head p{color:var(--muted);margin-top:16px;font-size:1.06rem}
@media (max-width:700px){.sec{padding:72px 0}}

/* welcome */
.welcome{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.welcome-text p{color:var(--muted);margin-top:18px;max-width:60ch}
.welcome-text p strong{color:var(--ink)}
.arch{position:relative;max-width:380px;margin-inline:auto;width:100%}
.arch::before{content:"";position:absolute;inset:-18px -18px 40px 18px;border:2px solid var(--blue);border-bottom:0;border-radius:999px 999px 0 0}
.arch img{position:relative;width:100%;aspect-ratio:560/822;object-fit:cover;border-radius:999px 999px 28px 28px}
.purpose{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:80px;border-top:1px solid var(--line)}
.purpose div{padding:28px 28px 0 0;display:flex;gap:16px;align-items:flex-start}
.purpose div+div{padding-left:28px;border-left:1px solid var(--line)}
.purpose .badge{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--blue);display:grid;place-items:center;flex:none}
.purpose h3{font-size:1.45rem}
.purpose p{color:var(--muted);font-size:.95rem;margin-top:6px}
@media (max-width:860px){
  .welcome{grid-template-columns:1fr;gap:56px}
  .purpose{grid-template-columns:1fr;margin-top:56px}
  .purpose div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}
  .purpose div{padding:22px 0}
}

/* about (navy) */
.about{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.about .kicker{color:var(--blue)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.about-photo{position:relative}
.about-photo img{border-radius:28px;width:100%;aspect-ratio:3/2;object-fit:cover}
.about-photo::after{content:"";position:absolute;right:-34px;bottom:-34px;width:150px;height:150px;border:2px solid var(--blue);border-radius:50%;pointer-events:none}
.about h2{font-size:clamp(1.9rem,3.6vw,2.7rem)}
.mission{margin-top:32px;background:var(--navy-2);border-radius:22px;padding:28px 30px}
.mission h3{font-size:1.05rem;color:var(--blue);font-weight:700}
.mission p{font-style:italic;font-size:1.14rem;line-height:1.55;margin-top:10px;color:#fff}
.team{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;padding:0;list-style:none}
.team li{background:var(--navy-2);border-radius:999px;padding:9px 18px;font-weight:600;font-size:.93rem}
@media (max-width:860px){.about-grid{grid-template-columns:1fr;gap:56px}.about-photo::after{right:-14px;bottom:-30px;width:110px;height:110px}}

/* services */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.tab{border:0;cursor:pointer;background:var(--surface);color:var(--ink);font-family:var(--font-head);font-weight:700;font-size:1.05rem;padding:12px 22px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;box-shadow:none}
.panel{background:var(--surface);border-radius:28px;overflow:hidden;border:1px solid var(--line)}
.panel-photo img{width:100%;height:clamp(180px,26vw,300px);object-fit:cover}
.panel-body{padding:40px 44px 44px}
.panel-body h3{font-size:clamp(1.6rem,3vw,2.2rem)}
.svc{display:grid;grid-template-columns:1fr 1fr;column-gap:44px;margin-top:22px;padding:0;list-style:none}
.svc li{display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.svc .i{width:46px;height:46px;border-radius:50%;background:var(--tint);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.svc h4{font-family:var(--font-body);font-weight:600;font-size:1.06rem;line-height:1.3}
.svc p{color:var(--muted);font-size:.95rem;margin-top:4px}
@media (max-width:760px){.svc{grid-template-columns:1fr}.panel-body{padding:28px 22px 30px}}

/* plans */
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.plan{background:var(--surface);border-radius:24px;padding:28px 24px 30px;border:1px solid var(--line);display:flex;flex-direction:column}
.plan .badge{width:54px;height:54px;border-radius:50%;background:var(--navy);color:var(--blue);display:grid;place-items:center;margin-bottom:26px}
.plan h3{font-size:1.6rem}
.plan p{color:var(--muted);font-size:.95rem;margin-top:12px}
.plans-cta{margin-top:22px;background:var(--navy);color:#fff;border-radius:24px;padding:34px 38px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.plans-cta h3{font-size:1.65rem}
.plans-cta p{color:var(--on-navy-muted);margin-top:6px}
@media (max-width:980px){.plans{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.plans{grid-template-columns:1fr}.plans-cta{padding:28px 24px}}

/* blog cards */
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.post-card{background:var(--surface);border-radius:24px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;text-decoration:none;color:inherit}
.post-card img{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--tint)}
.post-card .pc-body{padding:22px 24px 26px;display:flex;flex-direction:column;flex:1}
.post-meta{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.post-meta b{color:var(--blue-ink);font-weight:600}
.post-card h3{font-size:1.32rem;margin-top:10px}
.post-card:hover h3{color:var(--blue-ink)}
.post-card p{color:var(--muted);font-size:.95rem;margin-top:10px}
.post-card .more{margin-top:auto;padding-top:18px;font-weight:600;font-size:.93rem;color:var(--blue-ink)}
.blog-foot{margin-top:36px;display:flex;justify-content:center}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:24px;padding:48px 28px;text-align:center;color:var(--muted)}
@media (max-width:980px){.posts{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.posts{grid-template-columns:1fr}}

/* contact */
.contact{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding-bottom:0}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;position:relative}
.contact h2{font-size:clamp(2.2rem,4.6vw,3.4rem);max-width:13ch}
.contact-list{list-style:none;padding:0;margin:36px 0 0;display:grid;gap:18px}
.contact-list li{display:flex;gap:14px;align-items:flex-start}
.contact-list .ico{color:var(--blue);margin-top:3px}
.contact-list a{text-decoration:none}
.contact-list a:hover{color:var(--blue)}
.contact-list small{display:block;color:var(--on-navy-muted);font-size:.86rem}
.form{background:var(--navy-2);border-radius:26px;padding:32px;display:grid;gap:16px;align-self:start;margin-bottom:96px}
.form h3{font-size:1.45rem}
.form p.hint{color:var(--on-navy-muted);font-size:.92rem;margin-top:-6px}
.field label{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px;color:#DCE6F3}
.field input,.field select,.field textarea{width:100%;background:var(--navy);border:1.5px solid var(--navy-line);border-radius:14px;padding:12px 14px;color:#fff}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form{grid-column:2;grid-row:1/3}
.contact-photo{grid-column:1;grid-row:2;align-self:end;margin-top:12px}
.contact-photo img{width:min(500px,100%);border-radius:260px 260px 0 0;aspect-ratio:1000/728;object-fit:cover;object-position:center top}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}.form,.contact-photo{grid-column:auto;grid-row:auto}.row2{grid-template-columns:1fr}.form{padding:24px}}

.site-foot{background:var(--navy);color:var(--on-navy-muted);border-top:1px solid var(--navy-line);padding:40px 0 48px;font-size:.9rem}
.foot-in{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
.site-foot img{width:150px}
.site-foot a{text-decoration:none}
.site-foot a:hover{color:#fff}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 22px}

/* ---------- blog page ---------- */
.page-hero{background:var(--navy);color:#fff;padding:72px 0 64px;position:relative;overflow:hidden}
.page-hero h1{font-size:clamp(2.4rem,5vw,3.8rem)}
.page-hero p{color:var(--on-navy-muted);margin-top:16px;max-width:52ch;font-size:1.1rem}
.page-hero .kicker{color:var(--blue)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.chip{border:0;cursor:pointer;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:9px 18px;font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:none}
.admin-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:var(--tint);border-radius:18px;padding:16px 20px;margin-bottom:32px;font-size:.93rem}
.admin-bar .ico{color:var(--blue-ink)}
.admin-bar span{display:flex;gap:10px;align-items:center}

/* article */
.article{padding:56px 0 96px}
.article-in{width:min(100% - 40px,760px);margin-inline:auto}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;color:var(--blue-ink);font-size:.95rem}
.article h1{font-size:clamp(2rem,4.6vw,3.1rem);margin-top:22px}
.article .post-meta{margin-top:16px;font-size:.92rem}
.article-cover{margin:34px 0 8px;border-radius:24px;width:100%;aspect-ratio:16/9;object-fit:cover}
.prose{font-size:1.08rem;line-height:1.78}
.prose p{margin-top:1.15em}
.prose h2{font-size:1.6rem;margin-top:1.8em}
.prose ul{padding-left:1.25em;margin:1em 0 0}
.prose li{margin-top:.45em}
.prose li::marker{color:var(--blue)}
.prose strong{font-weight:600}
.article-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.article-cta{margin-top:40px;background:var(--navy);color:#fff;border-radius:24px;padding:30px 32px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.article-cta h3{font-size:1.4rem}
.article-cta p{color:var(--on-navy-muted);font-size:.95rem;margin-top:4px}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(1,10,30,.62);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.modal.open{display:flex}
.dialog{background:var(--surface);color:var(--ink);width:min(720px,100%);border-radius:24px;padding:30px;display:grid;gap:16px}
.dialog.small{width:min(440px,100%)}
.dialog h2{font-size:1.6rem}
.dialog .field label{color:var(--ink)}
.dialog .field input,.dialog .field select,.dialog .field textarea{background:var(--bg);border-color:var(--line);color:var(--ink)}
.dialog .field textarea{min-height:260px;font-size:.96rem;line-height:1.6}
.dialog .help{font-size:.84rem;color:var(--muted);margin-top:6px}
.dialog-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:6px}
.cover-pick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cover-pick img{width:120px;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--tint)}
.cover-pick label.btn{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:.93rem;z-index:120;display:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{display:block}

.wa-float{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:40;width:58px;height:58px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(1,14,46,.28)}
.wa-float .ico{width:28px;height:28px;stroke-width:2}
/* ---------- v3: moderno ---------- */
:root{--soft:#EAF2FA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--soft:#061A3A}}
:root[data-theme="dark"]{--soft:#061A3A}
.site-head{background:rgba(1,14,46,.92);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.btn{border-radius:14px}
.btn-sm{border-radius:12px}
.hero-in{padding:80px 0 150px}
.hero-kicker{display:inline-flex;align-items:center;gap:10px;background:rgba(30,155,230,.12);border:1px solid rgba(30,155,230,.35);border-radius:999px;padding:7px 16px;font-size:.95rem}
.live{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(30,155,230,.25)}
.hero h1{max-width:11ch}
.float-chip{position:absolute;z-index:3;display:flex;gap:12px;align-items:center;background:#fff;color:#0A1A3A;border-radius:18px;padding:13px 16px;box-shadow:0 18px 40px rgba(0,0,0,.28);max-width:250px}

l día.\n\n## Cómo aprovechar las visitas familiares\n\n- Lleve fotografías y pida que le cuente las historias detrás de ellas.\n- Pongan juntos la música que le gustaba en su juventud.\n- Compartan una comida o un postre favorito, siempre de acuerdo con su dieta.\n- Más que la duración, importa la frecuencia: visitas cortas y constantes valen mucho.\n\n## Un hogar con las puertas abiertas\n\nEn Cuidado Vital tenemos horarios de visita flexibles porque creemos que la familia es parte del equipo. Cuidamos a los tuyos como si fueran nuestros."}]</script>

const coverSrc = c => !c ? "" : (c.startsWith("@") ? (IMG[c.slice(1)] || "") : c);
const fmtDate = d => { try { return new Date(d + "T12:00:00").toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"}); } catch(e){ return d; } };
const readMin = body => Math.max(1, Math.round(String(body||"").split(/\s+/).length / 200));
const slugify = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,70) || "entrada";

function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
}
function renderBody(text){
  const blocks = String(text||"").replace(/\r/g,"").split(/\n\s*\n/);
  return blocks.map(b => {
    const lines = b.split("\n").filter(l => l.trim());
    if (!lines.length) return "";
    if (lines[0].startsWith("## ")) {
      const h = "<h2>" + inline(lines[0].slice(3)) + "</h2>";
      const rest = lines.slice(1).join("\n");
      return h + (rest ? renderBody(rest) : "");
    }
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) {
      return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-•]\s+/,"")) + "</li>").join("") + "</ul>";
    }
    return "<p>" + lines.map(inline).join("<br>") + "</p>";
  }).join("");
}

const SECTIONS = ["nosotros","un-dia","servicios","planes","contacto"];
function route(){
  const h = (location.hash || "#/").replace(/^#\/?/,"");
  const parts = h.split("/");
  document.getElementById("nav").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  document.getElementById("menuBtn").innerHTML = ico("menu");
  let navKey = "";
  if (parts[0] === "blog" && parts[1]) {
    const p = POSTS.find(x => x.slug === decodeURIComponent(parts[1]));
    app.innerHTML = postView(p);
    document.title = (p ? p.title + " · " : "") + "Blog Cuidado Vital";
    navKey = "blog"; window.scrollTo(0,0);
    if (p) mountPostAdmin(p);
  } else if (parts[0] === "blog") {
    app.innerHTML = blogView();
    document.title = "Blog · Hogar Geriátrico Cuidado Vital";
    navKey = "blog"; window.scrollTo(0,0);
    bindBlog(); mountBlogAdmin();
  } else {
    if (!document.getElementById("inicio")) { app.innerHTML = homeView(); bindHome(); }
    document.title = "Hogar Geriátrico Cuidado Vital · Cali";
    if (SECTIONS.includes(parts[0])) {
      navKey = parts[0];
      const el = document.getElementById(parts[0]);
      if (el) requestAnimationFrame(() => el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}));
    } else window.scrollTo(0,0);
  }
  document.querySelectorAll("[data-nav]").forEach(a => { if (a.dataset.nav === navKey) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
}

function bindHome(){
  renderPanel(0);
  const tabs = [...document.querySelectorAll(".tab")];
  tabs.forEach((t,i) => {
    t.addEventListener("click", () => renderPanel(i));
    t.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        const n = (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
        renderPanel(n); tabs[n].focus();
      }
    });
  });
  const cf = document.getElementById("contactForm"), send = document.getElementById("cf-send");
  const buildText = () => {
    const v = id => document.getElementById(id).value.trim();
    const name = v("cf-name"), phone = v("cf-phone"), msg = v("cf-msg"), plan = document.getElementById("cf-plan").value;
    return `Hola, soy ${name}${phone ? " (tel. " + phone + ")" : ""}. Me interesa agendar una visita al Hogar Cuidado Vital.\nPlan de interés: ${plan}.${msg ? "\n" + msg : ""}`;
  };
  const sync = () => { send.href = waLink(buildText()); };
  cf.addEventListener("input", sync);
  cf.addEventListener("change", sync);
  cf.addEventListener("submit", e => e.preventDefault());
  send.addEventListener("click", e => {
    if (!document.getElementById("cf-name").value.trim()) { e.preventDefault(); toast("Escriba su nombre para continuar."); document.getElementById("cf-name").focus(); return; }
    sync();
  });
}

function bindBlog(){
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    activeCat = c.dataset.cat; app.innerHTML = blogView(); bindBlog(); mountBlogAdmin();
  }));
}

let canEdit = false, artifactNS = null;
async function initAdmin(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const user = await window.claude.use("user");
    canEdit = !!(user && await user.isOwner() && await user.canEdit());
    if (canEdit) artifactNS = await window.claude.use("artifact");
    if (!artifactNS) canEdit = false;
  } catch(e) { canEdit = false; }
  if (canEdit) { mountBlogAdmin(); const p = currentPost(); if (p) mountPostAdmin(p); }
}

    <div class="field"><label>Imagen de portada</label>
      <div class="cover-pick"><img id="ed-cover-prev" src="${coverSrc(draftCover)}" alt="">
        <label class="btn btn-line btn-sm">${ico("image")}Elegir imagen<input type="file" accept="image/*" id="ed-cover" class="sr"></label>
        <button class="btn btn-line btn-sm" id="ed-cover-clear" type="button">Quitar</button></div></div>
    <div class="field"><label for="ed-body">Contenido</label><textarea id="ed-body">${esc(d.body)}</textarea>
      <p class="help">Deje una línea en blanco entre párrafos. Use «## » al inicio de una línea para un subtítulo, «- » para listas y **texto** para negrita.</p></div>
    <div class="dialog-actions">
      <button class="btn btn-line" id="ed-cancel" type="button">Cancelar</button>
      <button class="btn btn-blue" id="ed-save" type="button">${p ? "Guardar cambios" : "Publicar entrada"}</button>
    </div></div>`;
  m.classList.add("open");
  document.getElementById("ed-title").focus();
  document.getElementById("ed-cancel").onclick = () => { m.classList.remove("open"); try{sessionStorage.removeItem("cv-draft")}catch(e){} };
  document.getElementById("ed-cover-clear").onclick = () => { draftCover = ""; document.getElementById("ed-cover-prev").src = ""; };
  document.getElementById("ed-cover").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { draftCover = await shrink(f); document.getElementById("ed-cover-prev").src = draftCover; }
    catch(err) { toast("No pudimos leer esa imagen. Pruebe con un JPG o PNG."); }
  };
  document.getElementById("ed-save").onclick = () => {
    const v = id => document.getElementById(id).value.trim();
    const title = v("ed-title"), body = v("ed-body");
    if (!title) { toast("Escriba un título."); return; }
    if (!body) { toast("Escriba el contenido de la entrada."); return; }
    const entry = {
      id: p ? p.id : "p" + Date.now().toString(36),
      slug: p ? p.slug : uniqueSlug(slugify(title)),
      title, category: v("ed-cat") || "General", date: v("ed-date") || new Date().toISOString().slice(0,10),
      excerpt: v("ed-excerpt") || body.replace(/[#*\-]/g,"").slice(0,160).trim() + "…",
      cover: draftCover, body
    };
    try { sessionStorage.setItem("cv-draft", JSON.stringify(Object.assign({}, entry, {id: p ? p.id : "new"}))); } catch(e) {}
    const next = p ? POSTS.map(x => x.id === p.id ? entry : x) : [entry, ...POSTS];
    save(next, p ? "Cambios guardados." : "Entrada publicada.", "#/blog/" + entry.slug);
  };
}
function uniqueSlug(s){ let out = s, n = 2; while (POSTS.some(p => p.slug === out)) out = s + "-" + n++; return out; }

function shrink(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const max = 1400, k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.78));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function confirmDelete(p){
  const m = document.getElementById("confirm");
  m.innerHTML = `<div class="dialog small"><h2>¿Eliminar esta entrada?</h2><p style="color:var(--muted)">«${esc(p.title)}» dejará de verse en el blog.</p>
    <div class="dialog-actions"><button class="btn btn-line" id="cd-no">Cancelar</button><button class="btn btn-danger" id="cd-yes">Eliminar</button></div></div>`;
  m.classList.add("open");
  document.getElementById("cd-no").onclick = () => m.classList.remove("open");
  document.getElementById("cd-yes").onclick = () => { m.classList.remove("open"); save(POSTS.filter(x => x.id !== p.id), "Entrada eliminada.", "#/blog"); };
}

let saving = false;
async function save(next, okMsg, goTo){
  if (saving) return;
  if (!artifactNS) { toast("La edición solo está disponible para quien administra esta página."); return; }
  saving = true;
  const btn = document.getElementById("ed-save"); if (btn) { btn.disabled = true; btn.textContent = "Publicando…"; }
  const json = JSON.stringify(next).replace(/</g,"\\u003c");
  const html = SRC.replace(/(<script type="application\/json" id="blog-data">)[\s\S]*?(<\/script>)/, (m0,a,b) => a + json + b);
  try { sessionStorage.setItem("cv-after", JSON.stringify({msg: okMsg, go: goTo})); } catch(e) {}
  try {
    await artifactNS.publish(html);
    try { sessionStorage.removeItem("cv-draft"); } catch(e) {}
    POSTS = next; document.getElementById("editor").classList.remove("open");
    location.hash = goTo; route(); toast(okMsg);
  } catch(err) {
    const code = err && err.code;
    try { sessionStorage.removeItem("cv-after"); } catch(e) {}
    if (code === "conflict") toast("Alguien publicó otra versión. La página se está actualizando.");
    else if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required") { canEdit = false; toast("Esta vista es de solo lectura."); }
    else if (code === "too_large") toast("La página quedó muy pesada. Use imágenes más livianas o elimine entradas antiguas.");
    else if (code === "rate_limited") toast("Demasiadas publicaciones seguidas. Espere un momento.");
    else toast("No se pudo publicar. Su borrador quedó guardado; intente de nuevo.");
  } finally {
    saving = false;
    if (btn) { btn.disabled = false; btn.textContent = "Publicar entrada"; }
  }
}

let tt;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 4200); }

/* ---------------- init ---------------- */
document.getElementById("year").textContent = new Date().getFullYear();
const menuBtn = document.getElementById("menuBtn");
menuBtn.addEventListener("click", () => {
  const nav = document.getElementById("nav"); const open = nav.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.innerHTML = ico(open ? "x" : "menu");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".modal.open").forEach(m => m.classList.remove("open")); });
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.classList.remove("open"); }));
window.addEventListener("hashchange", route);
route();
try {
  const after = JSON.parse(sessionStorage.getItem("cv-after") || "null");
  if (after) { sessionStorage.removeItem("cv-after"); sessionStorage.removeItem("cv-draft"); if (after.go && location.hash !== after.go) location.hash = after.go; toast(after.msg); }
} catch(e) {}
initAdmin();
})();
</script>
